<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <title>Sitemap</title>
    <!-- Global CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Page specific CSS -->
    <link rel="stylesheet" href="styles/sitemap.css">
</head>

<body>
    <header>
        <nav>
            <section class="logo-area">
                <section class="logo-circle"></section>
                <section class="logo-text">
                    <h1>Echoes From The Deep</h1>
                    <p>SDG 14 · Life Below Water</p>
                </section>
            </section>
            <section class="nav-links">
                <a href="home.html" >Home</a>
                <a href="gallery.html">Gallery</a>
                <a href="ais.html">Impact Simulator</a>
                <a href="feedback.html">Feedback</a>
                <a href="team.html">Team</a>
                <a href="profile.html">Profile</a>
                <a href="sitemap.html" class="active">Sitemap</a>
            </section>
        </nav>
    </header>

    <main>
        <div class="page-header">
        <h2 class="page-title">Site Architecture</h2>
        <p class="page-sub">Dive into every corner of our ocean</p>
        </div>
        <!-- Desktop Sitemap -->
        <div class="sitemap-wrapper desktop-map">
            <svg viewBox="0 0 1100 400" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <marker id="arrowD" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
                        <path d="M0,0 L0,6 L9,3 z" fill="rgba(148,216,213,0.7)" />
                    </marker>
                    <filter id="glow">
                        <feGaussianBlur stdDeviation="3" result="blur"/>
                        <feComposite in="SourceGraphic" in2="blur" operator="over"/>
                    </filter>
                    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0a2a3a;stop-opacity:0.95"/>
                        <stop offset="100%" style="stop-color:#071820;stop-opacity:0.98"/>
                    </linearGradient>
                    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" style="stop-color:#0d4a5e;stop-opacity:0.98"/>
                        <stop offset="100%" style="stop-color:#083040;stop-opacity:1"/>
                    </linearGradient>
                </defs>

                <!-- Splash Screen (Root) -->
                <a href="splash.html" tabindex="0" class="svg-link">
                    <title>Link to the splash screen</title>
                    <g class="node-group root-node">
                        <rect x="450" y="20" width="200" height="56" rx="10" class="box-rect root-rect"/>
                        <text x="550" y="48" class="node-text root-text">⬡ Splash Screen</text>
                        <text x="550" y="65" class="node-sub">Entry point</text>
                    </g>
                </a>

                <!-- Home -->
                <a href="home.html" tabindex="0" class="svg-link">
                    <title>Link to the home page</title>
                    <g class="node-group home-node">
                        <rect x="470" y="130" width="160" height="52" rx="8" class="box-rect home-rect"/>
                        <text x="550" y="155" class="node-text">◈ Home</text>
                        <text x="550" y="172" class="node-sub">Main hub</text>
                    </g>
                </a>

                <!-- Child Pages Row -->
                <a href="gallery.html" tabindex="0" class="svg-link">
                    <title>Link to the gallery page</title>
                    <g class="node-group">
                        <rect x="40" y="290" width="140" height="52" rx="8" class="box-rect child-rect"/>
                        <text x="110" y="313" class="node-text">◎ Gallery</text>
                        <text x="110" y="330" class="node-sub">Marine visuals</text>
                    </g>
                </a>

                <a href="ais.html" tabindex="0" class="svg-link">
                    <title>Link to the impact simulator</title>
                    <g class="node-group">
                        <rect x="210" y="290" width="140" height="52" rx="8" class="box-rect child-rect"/>
                        <text x="280" y="313" class="node-text">⟁ Simulator</text>
                        <text x="280" y="330" class="node-sub">Ocean impact</text>
                    </g>
                </a>

                <a href="feedback.html" tabindex="0" class="svg-link">
                    <title>Link to the feedback page</title>
                    <g class="node-group">
                        <rect x="380" y="290" width="140" height="52" rx="8" class="box-rect child-rect"/>
                        <text x="450" y="313" class="node-text">◇ Feedback</text>
                        <text x="450" y="330" class="node-sub">Share thoughts</text>
                    </g>
                </a>

                <a href="team.html" tabindex="0" class="svg-link">
                    <title>Link to the team page</title>
                    <g class="node-group">
                        <rect x="550" y="290" width="140" height="52" rx="8" class="box-rect child-rect"/>
                        <text x="620" y="313" class="node-text">⬡ Team</text>
                        <text x="620" y="330" class="node-sub">Meet the crew</text>
                    </g>
                </a>

                <a href="profile.html" tabindex="0" class="svg-link">
                    <title>Link to the profile page</title>
                    <g class="node-group">
                        <rect x="720" y="290" width="140" height="52" rx="8" class="box-rect child-rect"/>
                        <text x="790" y="313" class="node-text">◉ Profile</text>
                        <text x="790" y="330" class="node-sub">Your account</text>
                    </g>
                </a>

                <a href="sitemap.html" tabindex="0" class="svg-link">
                    <title>Link to the sitemap</title>
                    <g class="node-group active-node">
                        <rect x="890" y="290" width="140" height="52" rx="8" class="box-rect active-rect"/>
                        <text x="960" y="313" class="node-text active-text">∷ Sitemap</text>
                        <text x="960" y="330" class="node-sub active-sub">You are here</text>
                    </g>
                </a>

                <!-- Connector: Splash → Home -->
                <line x1="550" y1="76" x2="550" y2="125" stroke="rgba(148,216,213,0.5)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowD)" />

                <!-- Connector: Home → horizontal spine -->
                <line x1="550" y1="182" x2="550" y2="240" stroke="rgba(148,216,213,0.45)" stroke-width="1.5" />

                <!-- Horizontal spine -->
                <line x1="110" y1="240" x2="960" y2="240" stroke="rgba(148,216,213,0.3)" stroke-width="1.5" />

                <!-- Bubble accents on spine -->
                <circle cx="110" cy="240" r="3" fill="rgba(148,216,213,0.5)"/>
                <circle cx="280" cy="240" r="3" fill="rgba(148,216,213,0.5)"/>
                <circle cx="450" cy="240" r="3" fill="rgba(148,216,213,0.5)"/>
                <circle cx="620" cy="240" r="3" fill="rgba(148,216,213,0.5)"/>
                <circle cx="790" cy="240" r="3" fill="rgba(148,216,213,0.5)"/>
                <circle cx="960" cy="240" r="3" fill="rgba(148,216,213,0.6)"/>

                <!-- Connectors: Spine → child nodes -->
                <line x1="110" y1="240" x2="110" y2="285" stroke="rgba(148,216,213,0.4)" stroke-width="1.5" marker-end="url(#arrowD)" />
                <line x1="280" y1="240" x2="280" y2="285" stroke="rgba(148,216,213,0.4)" stroke-width="1.5" marker-end="url(#arrowD)" />
                <line x1="450" y1="240" x2="450" y2="285" stroke="rgba(148,216,213,0.4)" stroke-width="1.5" marker-end="url(#arrowD)" />
                <line x1="620" y1="240" x2="620" y2="285" stroke="rgba(148,216,213,0.4)" stroke-width="1.5" marker-end="url(#arrowD)" />
                <line x1="790" y1="240" x2="790" y2="285" stroke="rgba(148,216,213,0.4)" stroke-width="1.5" marker-end="url(#arrowD)" />
                <line x1="960" y1="240" x2="960" y2="285" stroke="rgba(100,200,210,0.6)" stroke-width="1.5" marker-end="url(#arrowD)" />
            </svg>
        </div>

        <!-- Mobile Sitemap -->
        <div class="sitemap-wrapper mobile-map">
            <svg viewBox="0 0 360 760" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <marker id="arrowM" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
                        <path d="M0,0 L0,6 L9,3 z" fill="rgba(148,216,213,0.7)" />
                    </marker>
                </defs>

                <!-- Splash -->
                <a href="splash.html" tabindex="0">
                    <title>Link to the splash screen</title>
                    <g class="node-group root-node">
                        <rect x="80" y="20" width="200" height="52" rx="10" class="box-rect root-rect"/>
                        <text x="180" y="44" class="node-text root-text">⬡ Splash Screen</text>
                        <text x="180" y="62" class="node-sub">Entry point</text>
                    </g>
                </a>

                <!-- Home -->
                <a href="home.html" tabindex="0">
                    <title>Link to the home page</title>
                    <g class="node-group home-node">
                        <rect x="100" y="120" width="160" height="52" rx="8" class="box-rect home-rect"/>
                        <text x="180" y="144" class="node-text">◈ Home</text>
                        <text x="180" y="162" class="node-sub">Main hub</text>
                    </g>
                </a>

                <!-- Children -->
                <a href="gallery.html" tabindex="0">
                    <title>Link to the gallery page</title>
                    <g class="node-group">
                        <rect x="200" y="205" width="130" height="50" rx="8" class="box-rect child-rect"/>
                        <text x="265" y="228" class="node-text">◎ Gallery</text>
                        <text x="265" y="246" class="node-sub">Marine visuals</text>
                    </g>
                </a>

                <a href="ais.html" tabindex="0">
                    <title>Link to the impact simulator</title>
                    <g class="node-group">
                        <rect x="200" y="278" width="130" height="50" rx="8" class="box-rect child-rect"/>
                        <text x="265" y="301" class="node-text">⟁ Simulator</text>
                        <text x="265" y="319" class="node-sub">Ocean impact</text>
                    </g>
                </a>

                <a href="feedback.html" tabindex="0">
                    <title>Link to the feedback page</title>
                    <g class="node-group">
                        <rect x="200" y="351" width="130" height="50" rx="8" class="box-rect child-rect"/>
                        <text x="265" y="374" class="node-text">◇ Feedback</text>
                        <text x="265" y="392" class="node-sub">Share thoughts</text>
                    </g>
                </a>

                <a href="team.html" tabindex="0">
                    <title>Link to the team page</title>
                    <g class="node-group">
                        <rect x="200" y="424" width="130" height="50" rx="8" class="box-rect child-rect"/>
                        <text x="265" y="447" class="node-text">⬡ Team</text>
                        <text x="265" y="465" class="node-sub">Meet the crew</text>
                    </g>
                </a>

                <a href="profile.html" tabindex="0">
                    <title>Link to the profile page</title>
                    <g class="node-group">
                        <rect x="200" y="497" width="130" height="50" rx="8" class="box-rect child-rect"/>
                        <text x="265" y="520" class="node-text">◉ Profile</text>
                        <text x="265" y="538" class="node-sub">Your account</text>
                    </g>
                </a>

                <a href="sitemap.html" tabindex="0">
                    <title>Link to the sitemap</title>
                    <g class="node-group active-node">
                        <rect x="200" y="570" width="130" height="50" rx="8" class="box-rect active-rect"/>
                        <text x="265" y="593" class="node-text active-text">∷ Sitemap</text>
                        <text x="265" y="611" class="node-sub active-sub">You are here</text>
                    </g>
                </a>

                <!-- Arrows -->
                <line x1="180" y1="72" x2="180" y2="115" stroke="rgba(148,216,213,0.5)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowM)" />

                <!-- Vertical spine from Home down -->
                <line x1="180" y1="172" x2="180" y2="645" stroke="rgba(148,216,213,0.3)" stroke-width="1.5" />

                <!-- Dots on spine -->
                <circle cx="180" cy="230" r="3" fill="rgba(148,216,213,0.5)"/>
                <circle cx="180" cy="303" r="3" fill="rgba(148,216,213,0.5)"/>
                <circle cx="180" cy="376" r="3" fill="rgba(148,216,213,0.5)"/>
                <circle cx="180" cy="449" r="3" fill="rgba(148,216,213,0.5)"/>
                <circle cx="180" cy="522" r="3" fill="rgba(148,216,213,0.5)"/>
                <circle cx="180" cy="595" r="3" fill="rgba(100,200,210,0.7)"/>

                <!-- Horizontal branches -->
                <line x1="180" y1="230" x2="196" y2="230" stroke="rgba(148,216,213,0.4)" stroke-width="1.5" marker-end="url(#arrowM)" />
                <line x1="180" y1="303" x2="196" y2="303" stroke="rgba(148,216,213,0.4)" stroke-width="1.5" marker-end="url(#arrowM)" />
                <line x1="180" y1="376" x2="196" y2="376" stroke="rgba(148,216,213,0.4)" stroke-width="1.5" marker-end="url(#arrowM)" />
                <line x1="180" y1="449" x2="196" y2="449" stroke="rgba(148,216,213,0.4)" stroke-width="1.5" marker-end="url(#arrowM)" />
                <line x1="180" y1="522" x2="196" y2="522" stroke="rgba(148,216,213,0.4)" stroke-width="1.5" marker-end="url(#arrowM)" />
                <line x1="180" y1="595" x2="196" y2="595" stroke="rgba(100,200,210,0.6)" stroke-width="1.5" marker-end="url(#arrowM)" />
            </svg>
        </div>

    </main>
</body>
</html>
