<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Echoes From The Deep</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">


    <style>
       
		 *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
		
        :root {
            --teal: #49aec0;
            --teal-dark: #37909f;
            --white: #ffffff;
            --white-60: rgba(255, 255, 255, 0.6);
            --white-20: rgba(255, 255, 255, 0.2);
            --white-10: rgba(255, 255, 255, 0.1);
            --nav-bg: rgba(255, 255, 255, 0.12);
            --font-body: 'Montserrat', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }
		
        html, body {
            height: 100%;
            font-family: var(--font-body);
            color: var(--white);
        }
		
        .hero{
            height:100vh;
            width:100%;
            position:relative;
            display:flex;
            flex-direction:column;
            overflow:hidden;
            background-image: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)), url("assets/hero.jpeg");
            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
        }
		
        .hero::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0, 20, 35, 0.35) 0%,
                rgba(0, 10, 20, 0.15) 50%,
                rgba(0, 10, 25, 0.55) 100%
            );
            z-index: 1;
        }
		
        .hero > * {
            position: relative;
            z-index: 2;
        }
		
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 60px;
            background: var(nav-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--white-10);
        }
		
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }
		
        .logo-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid var(--teal);
            background: radial-gradient(circle at 40% 40%, var(--teal), transparent 70%);
            opacity: 0.85;
            flex-shrink: 0;
        }
		
        .logo-text h1 {
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            line-height: 1.2;
        }
		
        .logo-text p {
            font-size: 9px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.7;
            margin-top: 2px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--white);
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 7px 14px;
            border-radius: 5px;
            opacity: 0.7;
            transition: opacity 0.2s, background 0.2s;
        }
        .nav-links a:hover {
            opacity: 1;
            background: var(--white-10);
        }
        .nav-links a.active {
            opacity: 1;
            background: var(--white-20);
        }
        .hero-content {
            margin-top: auto;
            margin-bottom: auto;
            padding: 0 10%;
            padding-top: 40px;
        }

        .sdg-label {
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 24px;
            opacity: 0.85;
        }

        .title {
            font-family: var(--font-serif);
            font-size: 100px;
            line-height: 1.02;
            font-weight: 400;
        }

        .title span {
            font-style: italic;
            display: block;
            opacity: 0.88;
        }

        .description {
            font-family: var(--font-serif);
            font-style: italic;
            font-size: 20px;
			letter-spacing: 1.2px;
            margin: 28px 0 42px;
            line-height: 1.65;
            opacity: 0.9;
        }
        .btn-container {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 14px 34px;
            text-decoration: none;
            font-family: var(--font-body);
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 6px;
            transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
            display: inline-block;
        }

        .btn-fill {
            background-color: var(--teal);
            color: var(--white);
            border: 1px solid transparent;
        }

        .btn-fill:hover {
            background-color: var(--teal-dark);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(73, 174, 192, 0.4);
        }

        .btn-outline {
            border: 1px solid var(--white-60);
            color: var(--white);
            background: transparent;
        }

        .btn-outline:hover {
            background: var(--white-10);
            border-color: var(--white);
            transform: translateY(-2px);
        }
        .scroll-indicator {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            text-align: center;
            font-size: 10px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.65;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            animation: bounce 2s infinite ease-in-out;
        }

        .scroll-indicator .arrow {
            font-size: 20px;
            line-height: 1;
        }

        @keyframes bounce {
            0%, 100% { transform: translateX(-50%) translateY(0);   }
            50%       { transform: translateX(-50%) translateY(6px); }
        }

    </style>
</head>

<body>

    <section class="hero">

        <nav>
            <section class="logo-area">
                <section class="logo-circle"></section>
                <section class="logo-text">
                    <h1>Echoes From The Deep</h1>
                    <p>SDG 14 · Life Below Water</p>
                </section>
            </section>
            <section class="nav-links">
                <a href="#" class="active">Home</a>
                <a href="#">Gallery</a>
                <a href="#">Impact Simulator</a>
                <a href="#">Feedback</a>
                <a href="#">Team</a>
                <a href="#">Profile</a>
                <a href="#">Sitemap</a>
            </section>
        </nav>

        <section class="hero-content">
            <p class="sdg-label">SDG 14 · Life Below Water</p>

            <h1 class="title">
                Echoes From <span>the Deep</span>
            </h1>

            <p class="description">
                The ocean has been sending messages for decades.<br>
                It is time we finally listened.
            </p>

            <section class="btn-container">
                <a href="#" class="btn btn-fill">Take Action Now</a>
                <a href="#" class="btn btn-outline">Read The Story</a>
            </section>
        </section>

        <section class="scroll-indicator">
            Scroll
            <span class="arrow">↓</span>
        </section>
    </section>
	
<main>	
	
</main>
</body>
</html>
