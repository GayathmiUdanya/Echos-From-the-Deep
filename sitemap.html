<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <title>User Profile Page</title>
    <!-- Global CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Page specific CSS -->
    <link rel="stylesheet" href="styles/sitemap.css">
</head>

<body>
    <header>
        <nav>
            <section class="logo-area">
                <section class="logo-circle"></section>
                <section class="logo-text">
                    <h1>Echoes From The Deep</h1>
                    <p>SDG 14 · Life Below Water</p>
                </section>
            </section>
            <section class="nav-links">
                <a href="home.html" >Home</a>
                <a href="gallery.html">Gallery</a>
                <a href="ais.html">Impact Simulator</a>
                <a href="feedback.html">Feedback</a>
                <a href="team.html">Team</a>
                <a href="profile.html">Profile</a>
                <a href="sitemap.html" class="active">Sitemap</a>
            </section>
        </nav>
    </header>

    <main>
        <svg width="1200" height="400" xmlns="http://www.w3.org/2000/svg">

            <!-- Arrow Head -->
            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="10" 
                        refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#e8f4f8" />
                </marker>
            </defs>

            <!-- Row 1 -->
            <a href="splash.html">
                <rect x="500" y="20" width="160" height="50" class="box"/>
                <text x="580" y="45" class="text">Splash Screen</text>
            </a>

            <!-- Row 2 -->
            <a href="home.html">
                <rect x="520" y="120" width="120" height="50" class="box"/>
                <text x="580" y="145" class="text">Home</text>
            </a>

            <a href="gallery.html">
                <rect x="100" y="280" width="120" height="50" class="box"/>
                <text x="160" y="305" class="text">Gallery</text>

            </a>

            <!-- Row 3 -->

            <a href="ais.html">
                <rect x="260" y="280" width="120" height="50" class="box"/>
                <text x="320" y="305" class="text">Impact</text>
            </a>

            <a href="feedback.html">
                <rect x="420" y="280" width="120" height="50" class="box"/>
                <text x="480" y="305" class="text">Feedback</text>
            </a>

            <a href="team.html">
                <rect x="580" y="280" width="120" height="50" class="box"/>
                <text x="640" y="305" class="text">Team</text>
            </a>

            <a href="profile.html">
                <rect x="740" y="280" width="120" height="50" class="box"/>
                <text x="800" y="305" class="text">Profile</text>
            </a>

            <a href="sitemap.html">
                <rect x="900" y="280" width="120" height="50" class="box"/>
                <text x="960" y="305" class="text">Sitemap</text>
            </a>

            <!-- Arrows -->

            <!-- Splash Screen -->
            <line x1="580" y1="70" x2="580" y2="115" 
                stroke="#e8f4f8" stroke-width="1" 
                marker-end="url(#arrow)" />

            <!-- Home -->
            <line x1="580" y1="170" x2="580" y2="215"
                stroke="#e8f4f8" stroke-width="1"/>

            
            <!-- Horizontal line -->
            <line x1="160" y1="215" x2="960" y2="215"
                stroke="#e8f4f8" stroke-width="2" />

            <!-- Gallery -->
            <line x1="160" y1="215" x2="160" y2="275"
                stroke="#e8f4f8" stroke-width="1"
                marker-end="url(#arrow)" />

            <!-- Impact -->
            <line x1="320" y1="215" x2="320" y2="275"
                stroke="#e8f4f8" stroke-width="1"
                marker-end="url(#arrow)" />

            <!-- Feedback -->
            <line x1="480" y1="215" x2="480" y2="275"
                stroke="#e8f4f8" stroke-width="1"
                marker-end="url(#arrow)" />

            <!-- Team -->
            <line x1="640" y1="215" x2="640" y2="275"
                stroke="#e8f4f8" stroke-width="1"
                marker-end="url(#arrow)" />

            <!-- Profile -->
            <line x1="800" y1="215" x2="800" y2="275"
                stroke="#e8f4f8" stroke-width="1"
                marker-end="url(#arrow)" />

            <!-- Sitemap -->
            <line x1="960" y1="215" x2="960" y2="275"
                stroke="#e8f4f8" stroke-width="1"
                marker-end="url(#arrow)" />

        </svg>

    </main>
</body>
</html>
