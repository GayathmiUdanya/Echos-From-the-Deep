<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <title>User Profile Page</title>
    <!-- Global CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Page specific CSS -->
    <link rel="stylesheet" href="styles/sitemap.css">
</head>

<body>
    <header>
        <nav>
            <section class="logo-area">
                <section class="logo-circle"></section>
                <section class="logo-text">
                    <h1>Echoes From The Deep</h1>
                    <p>SDG 14 · Life Below Water</p>
                </section>
            </section>
            <section class="nav-links">
                <a href="home.html" >Home</a>
                <a href="gallery.html">Gallery</a>
                <a href="ais.html">Impact Simulator</a>
                <a href="feedback.html">Feedback</a>
                <a href="team.html">Team</a>
                <a href="profile.html">Profile</a>
                <a href="sitemap.html" class="active">Sitemap</a>
            </section>
        </nav>
    </header>

    <main>
        <!-- Horizontal Version -->
        <svg class="desktop-svg" viewBox="0 0 1100 380" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">

            <!-- Arrow Head -->
            <defs>
                <marker id="arrow" markerWidth="10" markerHeight="10" 
                        refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L0,6 L9,3 z" fill="#e8f4f8" />
                </marker>
            </defs>

            <!-- Row 1 -->
            <a href="splash.html" tabindex="0">
                <title>Link to the splash screen</title><rect x="500" y="20" width="160" height="50" class="box"/>
                <text x="580" y="45" class="text">Splash Screen</text>
            </a>

            <!-- Row 2 -->
            <a href="home.html" tabindex="0">
                <title>Link to the home page</title><rect x="520" y="120" width="120" height="50" class="box"/>
                <text x="580" y="145" class="text">Home</text>
            </a>

            <a href="gallery.html" tabindex="0">
                <title>Link to the gallery page</title><rect x="100" y="280" width="120" height="50" class="box"/>
                <text x="160" y="305" class="text">Gallery</text>

            </a>

            <!-- Row 3 -->

            <a href="ais.html" tabindex="0">
                <title>Link to the impact simulator</title><rect x="260" y="280" width="120" height="50" class="box"/>
                <text x="320" y="305" class="text">AIS</text>
            </a>

            <a href="feedback.html" tabindex="0">
                <title>Link to the feedback page</title><rect x="420" y="280" width="120" height="50" class="box"/>
                <text x="480" y="305" class="text">Feedback</text>
            </a>

            <a href="team.html" tabindex="0">
                <title>Link to the team page</title><rect x="580" y="280" width="120" height="50" class="box"/>
                <text x="640" y="305" class="text">Team</text>
            </a>

            <a href="profile.html" tabindex="0">
                <title>Link to the profile page</title><rect x="740" y="280" width="120" height="50" class="box"/>
                <text x="800" y="305" class="text">Profile</text>
            </a>

            <a href="sitemap.html" tabindex="0">
                <title>Link to the sitemap</title><rect x="900" y="280" width="120" height="50" class="box"/>
                <text x="960" y="305" class="text">Sitemap</text>
            </a>

            <!-- Arrows -->

            <!-- Splash Screen -->
            <line x1="580" y1="70" x2="580" y2="115" 
                stroke="#e8f4f8" stroke-width="1" 
                marker-end="url(#arrow)" />

            <!-- Home -->
            <line x1="580" y1="170" x2="580" y2="215"
                stroke="#e8f4f8" stroke-width="1"/>

            
            <!-- Horizontal line -->
            <line x1="160" y1="215" x2="960" y2="215"
                stroke="#e8f4f8" stroke-width="2" />

            <!-- Gallery -->
            <line x1="160" y1="215" x2="160" y2="275"
                stroke="#e8f4f8" stroke-width="1"
                marker-end="url(#arrow)" />

            <!-- Impact -->
            <line x1="320" y1="215" x2="320" y2="275"
                stroke="#e8f4f8" stroke-width="1"
                marker-end="url(#arrow)" />

            <!-- Feedback -->
            <line x1="480" y1="215" x2="480" y2="275"
                stroke="#e8f4f8" stroke-width="1"
                marker-end="url(#arrow)" />

            <!-- Team -->
            <line x1="640" y1="215" x2="640" y2="275"
                stroke="#e8f4f8" stroke-width="1"
                marker-end="url(#arrow)" />

            <!-- Profile -->
            <line x1="800" y1="215" x2="800" y2="275"
                stroke="#e8f4f8" stroke-width="1"
                marker-end="url(#arrow)" />

            <!-- Sitemap -->
            <line x1="960" y1="215" x2="960" y2="275"
                stroke="#e8f4f8" stroke-width="1"
                marker-end="url(#arrow)" />

        </svg>

        <!-- Mobile Vertical Version -->
        <svg class="mobile-svg" viewBox="0 0 400 800" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg">

            <defs>
                <marker id="arrow2" markerWidth="10" markerHeight="10" 
                        refX="5" refY="3" orient="auto">
                    <path d="M0,0 L0,6 L9,3 z" fill="#e8f4f8"/>
                </marker>
            </defs>

            <!-- Splash Screen-->
             <a href="splash.html" tabindex="0">
                <title>Link to the splash screen</title><rect x="120" y="20" width="160" height="50" class="box"/>
                <text x="200" y="45" class="text">Splash Screen</text>
             </a>


            <!-- Home -->
             <a href="home.html" tabindex="0">
                <title>Link to the home page</title><rect x="140" y="120" width="120" height="50" class="box"/>
                <text x="200" y="145" class="text">Home</text>
            </a>


            <!-- Gallery -->
            <a href="gallery.html" tabindex="0">
                <title>Link to the gallery page</title><rect x="280" y="195" width="100" height="50" class="box"/>
                <text x="330" y="220" class="text">Gallery</text>
            </a>


            <!-- Impact -->
            <a href="ais.html" tabindex="0">
                <title>Link to the impact simulator</title><rect x="280" y="275" width="100" height="50" class="box"/>
                <text x="330" y="300" class="text">AIS</text>
            </a>


            <!-- Feedback -->
            <a href="feedback.html" tabindex="0">
                <title>Link to the feedback Page</title><rect x="280" y="355" width="100" height="50" class="box"/>
                <text x="330" y="380" class="text">Feedback</text>
            </a>


            <!-- Team -->
            <a href="team.html" tabindex="0">
                <title>Link to the team page</title><rect x="280" y="435" width="100" height="50" class="box"/>
                <text x="330" y="460" class="text">Team</text>
            </a>


            <!-- Profile -->
            <a href="profile.html" tabindex="0">
                <title>Link to the profile page</title><rect x="280" y="515" width="100" height="50" class="box"/>
                <text x="330" y="540" class="text">Profile</text>
            </a>


            <!-- Sitemap -->
            <a href="sitemap.html" tabindex="0">
                <title>Link to the sitemap</title><rect x="280" y="595" width="100" height="50" class="box"/>
                <text x="330" y="620" class="text">Sitemap</text>
            </a>


            <!-- Arrows -->
             <!-- Splash Screen -->
            <line x1="200" y1="70" x2="200" y2="120" stroke="#e8f4f8" marker-end="url(#arrow2)"/>

            <!-- Verticle Spine -->
            <line x1="200" y1="170" x2="200" y2="620" stroke="#e8f4f8"/>

            <!-- Gallery -->
            <line x1="200" y1="220" x2="280" y2="220" stroke="#e8f4f8" marker-end="url(#arrow2)"/>

            <!-- AIS -->
            <line x1="200" y1="300" x2="280" y2="300" stroke="#e8f4f8" marker-end="url(#arrow2)"/>

            <!-- Feedback -->
            <line x1="200" y1="380" x2="280" y2="380" stroke="#e8f4f8" marker-end="url(#arrow2)"/>

            <!-- Team -->
            <line x1="200" y1="460" x2="280" y2="460" stroke="#e8f4f8" marker-end="url(#arrow2)"/>

            <!-- Profile -->
            <line x1="200" y1="540" x2="280" y2="540" stroke="#e8f4f8" marker-end="url(#arrow2)"/>

            <!-- Sitemap -->
            <line x1="200" y1="620" x2="280" y2="620" stroke="#e8f4f8" marker-end="url(#arrow2)"/>
        </svg>

    </main>
</body>
</html>
